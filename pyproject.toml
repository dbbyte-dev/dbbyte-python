[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbbyte"
version = "0.2.0"
description = "Official DBByte SDK for Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "DBByte, LLC" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://dbbyte.com"
Repository = "https://github.com/dbbyte/python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbbyte = ["py.typed"]
